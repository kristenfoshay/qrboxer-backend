version: '3.8'
services:
  db:
    image: postgres:14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qrboxer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db/qrboxer-schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=qrboxer
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key}
      - PORT=3001
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    command: npm start
    networks:
      - app-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    environment:
      - REACT_APP_BASE_URL=http://server:3001
    ports:
      - "3000:3000"
    depends_on:
      - server
    networks:
      - app-network
      
  client-tests:
    build:
      context: ./client
      dockerfile: Dockerfile.test
    environment:
      - CI=true
    depends_on:
      - client
    networks:
      - app-network

  test-db:
    image: postgres:14
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: qrboxer_test
    volumes:
      - test-db-data:/var/lib/postgresql/data
      - ./server/db/qrboxer-schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d qrboxer_test"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  tests:
    build: 
      context: ./server
      dockerfile: Dockerfile.test
    environment:
      - NODE_ENV=test
      - DOCKER_ENV=true
      - DB_HOST=test-db
      - DB_PORT=5432
      - DB_USER=test_user
      - DB_PASSWORD=test_password
      - DB_NAME=test_db
    command: >
      /bin/sh -c "
      while ! nc -z test-db 5432; do
        echo 'Waiting for database...';
        sleep 1;
      done;
      npm test -- --verbose --forceExit --detectOpenHandles --runInBand
      "
    depends_on:
      test-db:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  test-db-data:
